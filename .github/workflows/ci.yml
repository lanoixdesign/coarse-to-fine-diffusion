name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shape-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - name: Shape tests
        run: pytest -q tests
